<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poisoned Candy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #1a1208;
      background-image:
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 40px,
          rgba(255,255,255,0.012) 40px,
          rgba(255,255,255,0.012) 41px
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 60px,
          rgba(255,255,255,0.008) 60px,
          rgba(255,255,255,0.008) 61px
        ),
        linear-gradient(
          160deg,
          #1a1208 0%,
          #221808 25%,
          #1e1506 50%,
          #241a08 75%,
          #1a1208 100%
        );
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15,10,4,0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255,200,100,0.08);
      z-index: 100;
    }

    .room-code { font-size: 0.72rem; color: #5a4a2a; letter-spacing: 2px; }
    .room-code span { color: #ff6b81; font-weight: 700; font-size: 0.85rem; }

    .turn-indicator {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      transition: all 0.3s;
    }

    .turn-indicator.my-turn {
      background: rgba(78,204,163,0.15);
      color: #4ecca3;
      border: 1px solid rgba(78,204,163,0.3);
    }

    .turn-indicator.their-turn {
      background: rgba(240,192,64,0.1);
      color: #f0c040;
      border: 1px solid rgba(240,192,64,0.2);
    }

    .turn-indicator.waiting {
      color: #5a4a2a;
      border: 1px solid #2a2010;
    }

    #field {
      position: fixed;
      inset: 0;
      top: 44px;
    }

    /* Canvas for crumble particles */
    #crumbleCanvas {
      position: fixed;
      inset: 0;
      top: 44px;
      pointer-events: none;
      z-index: 50;
    }

    .candy-item {
      position: absolute;
      width: 80px;
      height: 80px;
      cursor: pointer;
      user-select: none;
    }

    .candy-inner {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.15s, filter 0.15s;
      /* No background — transparent so wood shows through */
    }

    .candy-inner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      /* multiply blends white away on light, screen blends on dark */
      mix-blend-mode: multiply;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .candy-item.my-turn-active:hover .candy-inner {
      transform: scale(1.12);
      filter: drop-shadow(0 0 12px rgba(255,107,129,0.7));
    }

    .candy-item.my-turn-active:hover .candy-inner img {
      filter: drop-shadow(0 0 12px rgba(255,107,129,0.7)) brightness(1.1);
    }

    .candy-item.not-my-turn { cursor: not-allowed; }
    .candy-item.taken { pointer-events: none; opacity: 0; }

    /* Crumble spot — stays after candy is taken */
    .crumble-spot {
      position: absolute;
      width: 80px;
      height: 80px;
      pointer-events: none;
      z-index: 5;
    }

    /* Waiting overlay */
    #waitingOverlay {
      position: fixed; inset: 0;
      background: rgba(15,10,4,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      z-index: 200;
    }

    .code-card {
      background: #1e1608;
      border: 1px solid rgba(255,200,100,0.1);
      border-radius: 16px;
      padding: 1.5rem 2.5rem;
      text-align: center;
    }

    .code-card p { color: #5a4a2a; font-size: 0.72rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .code-card .code { font-size: 2.4rem; font-weight: 900; color: #ff6b81; letter-spacing: 8px; }

    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    .btn-leave {
      background: none; border: 1px solid #2a2010;
      color: #5a4a2a; padding: 0.5rem 1.2rem;
      border-radius: 10px; cursor: pointer; font-size: 0.8rem;
    }

    /* Toast */
    #turnToast {
      position: fixed;
      top: 60px; left: 50%;
      transform: translateX(-50%);
      background: rgba(30,22,8,0.95);
      border: 1px solid rgba(255,200,100,0.1);
      border-radius: 12px;
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
      color: #aaa;
      z-index: 150;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    #turnToast.show { opacity: 1; }

    /* Result overlay */
    #resultOverlay {
      position: fixed; inset: 0;
      background: rgba(15,10,4,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 300;
    }

    #resultOverlay.show { display: flex; }

    .result-emoji { font-size: 5rem; line-height: 1; }
    .result-title {
      font-size: 2rem; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .result-title.won { color: #4ecca3; }
    .result-title.lost { color: #ff6b81; }
    .result-sub { color: #5a4a2a; font-size: 0.9rem; text-align: center; max-width: 280px; }

    .result-btns { display: flex; gap: 0.8rem; margin-top: 0.5rem; }

    .btn-play-again {
      background: #ff6b81; color: white;
      border: none; border-radius: 14px;
      padding: 0.9rem 1.8rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }

    .btn-home {
      background: #1e1608; color: #aaa;
      border: 1px solid #2a2010; border-radius: 14px;
      padding: 0.9rem 1.8rem; font-size: 1rem; cursor: pointer;
    }

    /* Poison glow */
    .candy-item.poison-reveal .candy-inner img {
      animation: poisonPulse 0.5s ease-in-out 3;
      filter: drop-shadow(0 0 20px rgba(255,50,50,1)) brightness(1.2);
    }

    @keyframes poisonPulse {
      0%,100% { filter: drop-shadow(0 0 8px rgba(255,50,50,0.4)) brightness(1); }
      50% { filter: drop-shadow(0 0 30px rgba(255,50,50,1)) brightness(1.3); }
    }

    /* Scoreboard */
    #scoreboard {
      position: fixed;
      bottom: 1rem; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      z-index: 100;
    }

    .score-card {
      background: rgba(20,14,4,0.9);
      border: 1px solid rgba(255,200,100,0.08);
      border-radius: 12px;
      padding: 0.5rem 1rem;
      text-align: center;
      min-width: 80px;
    }

    .score-card .s-name { font-size: 0.7rem; color: #5a4a2a; }
    .score-card .s-count { font-size: 1.1rem; font-weight: 700; color: #f0f0f0; }
    .score-card.active-player { border-color: rgba(255,107,129,0.4); }
  </style>
</head>
<body>

<div id="hud">
  <div class="room-code">ROOM <span id="hudCode">—</span></div>
  <div class="turn-indicator waiting" id="turnIndicator">Waiting...</div>
</div>

<div id="field"></div>
<canvas id="crumbleCanvas"></canvas>
<div id="turnToast"></div>

<div id="waitingOverlay">
  <h2 style="color:#ff6b81; font-size:1.3rem;">🍬 Share this code</h2>
  <div class="code-card">
    <p>ROOM CODE</p>
    <div class="code" id="overlayCode">—</div>
  </div>
  <small class="pulse" style="color:#5a4a2a">Waiting for opponent to join...</small>
  <button class="btn-leave" onclick="leaveGame()">Leave</button>
</div>

<div id="scoreboard">
  <div class="score-card" id="score0">
    <div class="s-name" id="sName0">—</div>
    <div class="s-count" id="sCount0">0</div>
  </div>
  <div class="score-card" id="score1">
    <div class="s-name" id="sName1">—</div>
    <div class="s-count" id="sCount1">0</div>
  </div>
</div>

<div id="resultOverlay">
  <div class="result-emoji" id="resultEmoji">🍬</div>
  <div class="result-title" id="resultTitle">—</div>
  <div class="result-sub" id="resultSub">—</div>
  <div class="result-btns">
    <button class="btn-play-again" onclick="playAgain()">Play Again</button>
    <button class="btn-home" onclick="leaveGame()">Home</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  // ── CRUMBLE ENGINE ──
  const canvas = document.getElementById('crumbleCanvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let animFrameId = null;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight - 44;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function spawnCrumble(x, y, palette) {
    const colors = palette && palette.length ? palette : ['#ff6b81', '#ffaa00', '#ff4444'];
    const count = 32;

    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const speed = 2 + Math.random() * 5;
      const size = 3 + Math.random() * 7;
      const color = colors[Math.floor(Math.random() * colors.length)];

      particles.push({
        x: x + (Math.random() - 0.5) * 30,
        y: y + (Math.random() - 0.5) * 30,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 1,
        size,
        color,
        alpha: 1,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.2,
        gravity: 0.15 + Math.random() * 0.1,
        shape: Math.random() > 0.5 ? 'rect' : 'circle'
      });
    }

    if (!animFrameId) animateCrumble();
  }

  function animateCrumble() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    particles = particles.filter(p => p.alpha > 0.02);

    for (const p of particles) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.alpha -= 0.022;
      p.rotation += p.rotSpeed;

      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);

      if (p.shape === 'rect') {
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    if (particles.length > 0) {
      animFrameId = requestAnimationFrame(animateCrumble);
    } else {
      animFrameId = null;
    }
  }

  // ── GAME ──
  const socket = io();
  const roomCode = window.location.pathname.split('/').pop().toUpperCase();
  const playerName = localStorage.getItem('playerName') || 'Player';

  let gameData = null;
  let myPlayerIndex = -1;
  let currentTurn = 0;
  let takenCandies = [];
  let pickCounts = [0, 0];
  let isMyTurn = false;
  let colorPalette = ['#ff6b81', '#ffaa00', '#ff4444'];

  document.getElementById('hudCode').textContent = roomCode;
  document.getElementById('overlayCode').textContent = roomCode;

  async function loadGame() {
    try {
      const res = await fetch(`/api/game/${roomCode}`);
      if (!res.ok) {
        document.getElementById('waitingOverlay').innerHTML =
          '<h2 style="color:#ff6b81">Room not found</h2><button class="btn-leave" onclick="location.href=\'/\'">Go home</button>';
        return;
      }

      gameData = await res.json();
      colorPalette = gameData.candy.colorPalette || colorPalette;
      renderField(gameData);

      myPlayerIndex = gameData.players.findIndex(p => p.name === playerName);
      if (myPlayerIndex === -1) myPlayerIndex = 1;

      if (gameData.players[0]) document.getElementById('sName0').textContent = gameData.players[0].name;
      if (gameData.players[1]) document.getElementById('sName1').textContent = gameData.players[1].name;

      if (gameData.status === 'in_progress') {
        hideWaiting();
        updateTurnUI(0);
      }

      socket.emit('joinRoom', { roomCode, playerName });

    } catch (err) {
      console.error(err);
    }
  }

  function renderField(data) {
    const field = document.getElementById('field');
    field.innerHTML = '';

    data.field.forEach((pos, index) => {
      const el = document.createElement('div');
      el.className = 'candy-item';
      el.id = `candy-${index}`;
      el.dataset.index = index;
      el.style.left = `calc(${pos.x}% - 40px)`;
      el.style.top = `calc(${pos.y}% - 40px)`;

      const inner = document.createElement('div');
      inner.className = 'candy-inner';
      inner.style.transform = `rotate(${pos.rotation}deg)`;

      const img = document.createElement('img');
      img.src = data.candy.imageUrl;
      img.alt = data.candy.name;

      inner.appendChild(img);
      el.appendChild(inner);
      el.addEventListener('click', () => onCandyClick(index, el));
      field.appendChild(el);
    });
  }

  function getCandyCenter(el) {
    const rect = el.getBoundingClientRect();
    const hudHeight = 44;
    return {
      x: rect.left + rect.width / 2,
      y: rect.top + rect.height / 2 - hudHeight
    };
  }

  function onCandyClick(index, el) {
    if (!isMyTurn) { showToast("It's not your turn!"); return; }
    if (takenCandies.includes(index)) return;
    socket.emit('pickCandy', { roomCode, playerName, index });
  }

  function hideWaiting() {
    document.getElementById('waitingOverlay').style.display = 'none';
  }

  function updateTurnUI(turnIndex) {
    currentTurn = turnIndex;
    isMyTurn = (turnIndex === myPlayerIndex);

    document.querySelectorAll('.candy-item').forEach(el => {
      if (takenCandies.includes(parseInt(el.dataset.index))) return;
      el.classList.remove('my-turn-active', 'not-my-turn');
      el.classList.add(isMyTurn ? 'my-turn-active' : 'not-my-turn');
    });

    const indicator = document.getElementById('turnIndicator');
    if (isMyTurn) {
      indicator.textContent = '🍬 Your turn';
      indicator.className = 'turn-indicator my-turn';
    } else {
      const oppName = gameData?.players[turnIndex]?.name || 'Opponent';
      indicator.textContent = `⏳ ${oppName}'s turn`;
      indicator.className = 'turn-indicator their-turn';
    }

    document.getElementById('score0').classList.toggle('active-player', turnIndex === 0);
    document.getElementById('score1').classList.toggle('active-player', turnIndex === 1);
  }

  function showToast(msg) {
    const toast = document.getElementById('turnToast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  socket.on('candyTaken', ({ playerName: picker, index, isPoison, takenCandies: taken, nextTurn }) => {
    takenCandies = taken;

    const el = document.getElementById(`candy-${index}`);
    if (el) {
      const center = getCandyCenter(el);

      if (isPoison) {
        el.classList.add('poison-reveal');
        // Big explosion for poison
        spawnCrumble(center.x, center.y, ['#ff2222', '#ff6b81', '#aa0000', '#ff4444', '#ffaaaa']);
      } else {
        // Normal crumble in candy colors
        spawnCrumble(center.x, center.y, colorPalette);
        setTimeout(() => el.classList.add('taken'), 350);
      }
    }

    const pickerIndex = gameData.players.findIndex(p => p.name === picker);
    if (pickerIndex !== -1) {
      pickCounts[pickerIndex]++;
      document.getElementById(`sCount${pickerIndex}`).textContent = pickCounts[pickerIndex];
    }

    if (!isPoison && nextTurn) {
      const nextTurnIndex = gameData.players.findIndex(p => p.name === nextTurn);
      setTimeout(() => updateTurnUI(nextTurnIndex), 400);
    }
  });

  socket.on('gameOver', ({ result, poisonedIndex, loserName }) => {
    // Disable all interaction
    document.querySelectorAll('.candy-item').forEach(el => {
      el.classList.remove('my-turn-active');
      el.classList.add('not-my-turn');
    });

    setTimeout(() => {
      const overlay = document.getElementById('resultOverlay');

      if (result === 'won') {
        document.getElementById('resultEmoji').textContent = '🎉';
        document.getElementById('resultTitle').textContent = 'You Won!';
        document.getElementById('resultTitle').className = 'result-title won';
        document.getElementById('resultSub').textContent = `${loserName} picked the poisoned candy!`;
      } else {
        document.getElementById('resultEmoji').textContent = '☠️';
        document.getElementById('resultTitle').textContent = 'Poisoned!';
        document.getElementById('resultTitle').className = 'result-title lost';
        document.getElementById('resultSub').textContent = 'You picked the poisoned candy. Better luck next time!';
      }

      overlay.classList.add('show');
    }, 2000);
  });

  socket.on('notYourTurn', () => showToast("It's not your turn!"));

  socket.on('opponentJoined', ({ playerName: oppName }) => {
    hideWaiting();
    if (gameData && gameData.players.length < 2) {
      gameData.players.push({ name: oppName });
      document.getElementById('sName1').textContent = oppName;
    }
    updateTurnUI(0);
    showToast(`${oppName} joined!`);
  });

  function playAgain() { window.location.href = '/'; }
  function leaveGame() { window.location.href = '/'; }

  loadGame();
</script>
</body>
</html>
