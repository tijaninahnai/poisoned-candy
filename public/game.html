<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poisoned Candy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111118;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17,17,24,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1a1a24;
      z-index: 100;
    }

    .room-code { font-size: 0.72rem; color: #444; letter-spacing: 2px; }
    .room-code span { color: #ff6b81; font-weight: 700; font-size: 0.85rem; }

    .turn-indicator {
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      transition: all 0.3s;
    }

    .turn-indicator.my-turn {
      background: rgba(78,204,163,0.15);
      color: #4ecca3;
      border: 1px solid rgba(78,204,163,0.3);
    }

    .turn-indicator.their-turn {
      background: rgba(240,192,64,0.1);
      color: #f0c040;
      border: 1px solid rgba(240,192,64,0.2);
    }

    .turn-indicator.waiting {
      color: #555;
      border: 1px solid #2a2a3a;
    }

    #field {
      position: fixed;
      inset: 0;
      top: 44px;
    }

    .candy-item {
      position: absolute;
      width: 80px;
      height: 80px;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.3s;
    }

    .candy-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.3s;
    }

    .candy-inner img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      pointer-events: none;
    }

    .candy-item.my-turn-active:hover .candy-inner {
      transform: scale(1.12);
      box-shadow: 0 0 16px rgba(255,107,129,0.6);
    }

    .candy-item.taken {
      pointer-events: none;
      opacity: 0;
    }

    .candy-item.not-my-turn {
      cursor: not-allowed;
    }

    /* Waiting overlay */
    #waitingOverlay {
      position: fixed; inset: 0;
      background: rgba(17,17,24,0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      z-index: 200;
    }

    .code-card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 1.5rem 2.5rem;
      text-align: center;
    }

    .code-card p { color: #555; font-size: 0.72rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .code-card .code { font-size: 2.4rem; font-weight: 900; color: #ff6b81; letter-spacing: 8px; }

    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    .btn-leave {
      background: none; border: 1px solid #2a2a3a;
      color: #555; padding: 0.5rem 1.2rem;
      border-radius: 10px; cursor: pointer; font-size: 0.8rem;
    }

    /* Turn announcement toast */
    #turnToast {
      position: fixed;
      top: 60px; left: 50%;
      transform: translateX(-50%);
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 0.6rem 1.2rem;
      font-size: 0.85rem;
      color: #aaa;
      z-index: 150;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    #turnToast.show { opacity: 1; }

    /* Result overlay */
    #resultOverlay {
      position: fixed; inset: 0;
      background: rgba(17,17,24,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 300;
    }

    #resultOverlay.show { display: flex; }

    .result-emoji { font-size: 5rem; line-height: 1; }
    .result-title {
      font-size: 2rem; font-weight: 900;
      letter-spacing: 2px; text-transform: uppercase;
    }
    .result-title.won { color: #4ecca3; }
    .result-title.lost { color: #ff6b81; }
    .result-sub { color: #555; font-size: 0.9rem; text-align: center; max-width: 280px; }

    .result-btns { display: flex; gap: 0.8rem; margin-top: 0.5rem; }

    .btn-play-again {
      background: #ff6b81; color: white;
      border: none; border-radius: 14px;
      padding: 0.9rem 1.8rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }

    .btn-home {
      background: #1a1a24; color: #aaa;
      border: 1px solid #2a2a3a; border-radius: 14px;
      padding: 0.9rem 1.8rem; font-size: 1rem; cursor: pointer;
    }

    /* Poison reveal */
    .candy-item.poison-reveal .candy-inner {
      animation: poisonPulse 0.5s ease-in-out 3;
    }

    @keyframes poisonPulse {
      0%,100% { box-shadow: 0 0 8px rgba(255,107,129,0.3); }
      50% { box-shadow: 0 0 30px rgba(255,107,129,1); }
    }

    /* Scoreboard */
    #scoreboard {
      position: fixed;
      bottom: 1rem; left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 1rem;
      z-index: 100;
    }

    .score-card {
      background: rgba(26,26,36,0.9);
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 0.5rem 1rem;
      text-align: center;
      min-width: 80px;
    }

    .score-card .s-name { font-size: 0.7rem; color: #555; }
    .score-card .s-count { font-size: 1.1rem; font-weight: 700; color: #f0f0f0; }
    .score-card.active-player { border-color: #ff6b81; }
  </style>
</head>
<body>

<div id="hud">
  <div class="room-code">ROOM <span id="hudCode">—</span></div>
  <div class="turn-indicator waiting" id="turnIndicator">Waiting...</div>
</div>

<div id="field"></div>
<div id="turnToast"></div>

<div id="waitingOverlay">
  <h2 style="color:#ff6b81; font-size:1.3rem;">🍬 Share this code</h2>
  <div class="code-card">
    <p>ROOM CODE</p>
    <div class="code" id="overlayCode">—</div>
  </div>
  <small class="pulse" style="color:#444">Waiting for opponent to join...</small>
  <button class="btn-leave" onclick="leaveGame()">Leave</button>
</div>

<div id="scoreboard">
  <div class="score-card" id="score0">
    <div class="s-name" id="sName0">—</div>
    <div class="s-count" id="sCount0">0</div>
  </div>
  <div class="score-card" id="score1">
    <div class="s-name" id="sName1">—</div>
    <div class="s-count" id="sCount1">0</div>
  </div>
</div>

<div id="resultOverlay">
  <div class="result-emoji" id="resultEmoji">🍬</div>
  <div class="result-title" id="resultTitle">—</div>
  <div class="result-sub" id="resultSub">—</div>
  <div class="result-btns">
    <button class="btn-play-again" onclick="playAgain()">Play Again</button>
    <button class="btn-home" onclick="leaveGame()">Home</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const roomCode = window.location.pathname.split('/').pop().toUpperCase();
  const playerName = localStorage.getItem('playerName') || 'Player';

  let gameData = null;
  let myPlayerIndex = -1;
  let currentTurn = 0;
  let takenCandies = [];
  let pickCounts = [0, 0];
  let isMyTurn = false;

  document.getElementById('hudCode').textContent = roomCode;
  document.getElementById('overlayCode').textContent = roomCode;

  async function loadGame() {
    try {
      const res = await fetch(`/api/game/${roomCode}`);
      if (!res.ok) {
        document.getElementById('waitingOverlay').innerHTML =
          '<h2 style="color:#ff6b81">Room not found</h2><button class="btn-leave" onclick="location.href=\'/\'">Go home</button>';
        return;
      }

      gameData = await res.json();
      renderField(gameData);

      // Figure out my player index
      myPlayerIndex = gameData.players.findIndex(p => p.name === playerName);
      if (myPlayerIndex === -1) myPlayerIndex = 1; // fallback for joining player

      // Update scoreboard names
      if (gameData.players[0]) document.getElementById('sName0').textContent = gameData.players[0].name;
      if (gameData.players[1]) document.getElementById('sName1').textContent = gameData.players[1].name;

      if (gameData.status === 'in_progress') {
        hideWaiting();
        updateTurnUI(0);
      }

      socket.emit('joinRoom', { roomCode, playerName });

    } catch (err) {
      console.error(err);
    }
  }

  function renderField(data) {
    const field = document.getElementById('field');
    field.innerHTML = '';

    data.field.forEach((pos, index) => {
      const el = document.createElement('div');
      el.className = 'candy-item';
      el.id = `candy-${index}`;
      el.style.left = `calc(${pos.x}% - 40px)`;
      el.style.top = `calc(${pos.y}% - 40px)`;

      const inner = document.createElement('div');
      inner.className = 'candy-inner';
      inner.style.transform = `rotate(${pos.rotation}deg)`;

      const img = document.createElement('img');
      img.src = data.candy.imageUrl;
      img.alt = data.candy.name;

      inner.appendChild(img);
      el.appendChild(inner);
      el.addEventListener('click', () => onCandyClick(index, el));
      field.appendChild(el);
    });
  }

  function onCandyClick(index, el) {
    if (!isMyTurn) {
      showToast("It's not your turn!");
      return;
    }
    if (takenCandies.includes(index)) return;

    socket.emit('pickCandy', { roomCode, playerName, index });
  }

  function hideWaiting() {
    document.getElementById('waitingOverlay').style.display = 'none';
  }

  function updateTurnUI(turnIndex) {
    currentTurn = turnIndex;
    isMyTurn = (turnIndex === myPlayerIndex);

    // Update all candy classes
    document.querySelectorAll('.candy-item').forEach(el => {
      el.classList.remove('my-turn-active', 'not-my-turn');
      if (!takenCandies.includes(parseInt(el.dataset.index))) {
        el.classList.add(isMyTurn ? 'my-turn-active' : 'not-my-turn');
      }
    });

    // Update HUD
    const indicator = document.getElementById('turnIndicator');
    if (isMyTurn) {
      indicator.textContent = '🍬 Your turn';
      indicator.className = 'turn-indicator my-turn';
    } else {
      const oppName = gameData?.players[turnIndex]?.name || 'Opponent';
      indicator.textContent = `⏳ ${oppName}'s turn`;
      indicator.className = 'turn-indicator their-turn';
    }

    // Update scoreboard active
    document.getElementById('score0').classList.toggle('active-player', turnIndex === 0);
    document.getElementById('score1').classList.toggle('active-player', turnIndex === 1);
  }

  function showToast(msg) {
    const toast = document.getElementById('turnToast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  }

  // Candy taken event — fires for both players
  socket.on('candyTaken', ({ playerName: picker, index, isPoison, takenCandies: taken, nextTurn }) => {
    takenCandies = taken;

    // Remove candy from field
    const el = document.getElementById(`candy-${index}`);
    if (el) {
      if (isPoison) {
        el.classList.add('poison-reveal');
      } else {
        setTimeout(() => el.classList.add('taken'), 300);
      }
    }

    // Update pick counts
    const pickerIndex = gameData.players.findIndex(p => p.name === picker);
    if (pickerIndex !== -1) {
      pickCounts[pickerIndex]++;
      document.getElementById(`sCount${pickerIndex}`).textContent = pickCounts[pickerIndex];
    }

    if (!isPoison && nextTurn) {
      // Find next turn index
      const nextTurnIndex = gameData.players.findIndex(p => p.name === nextTurn);
      setTimeout(() => updateTurnUI(nextTurnIndex), 400);
    }
  });

  // Game over
  socket.on('gameOver', ({ result, poisonedIndex, loserName }) => {
    // Reveal poison candy
    const poisonEl = document.getElementById(`candy-${poisonedIndex}`);
    if (poisonEl) {
      poisonEl.classList.remove('taken');
      poisonEl.classList.add('poison-reveal');
    }

    setTimeout(() => {
      const overlay = document.getElementById('resultOverlay');
      const emoji = document.getElementById('resultEmoji');
      const title = document.getElementById('resultTitle');
      const sub = document.getElementById('resultSub');

      if (result === 'won') {
        emoji.textContent = '🎉';
        title.textContent = 'You Won!';
        title.className = 'result-title won';
        sub.textContent = `${loserName} picked the poisoned candy!`;
      } else {
        emoji.textContent = '☠️';
        title.textContent = 'Poisoned!';
        title.className = 'result-title lost';
        sub.textContent = 'You picked the poisoned candy. Better luck next time!';
      }

      overlay.classList.add('show');
    }, 1800);
  });

  socket.on('notYourTurn', () => showToast("It's not your turn!"));

  socket.on('opponentJoined', ({ playerName: oppName }) => {
    hideWaiting();

    // Update player list if not loaded yet
    if (gameData && gameData.players.length < 2) {
      gameData.players.push({ name: oppName });
      document.getElementById('sName1').textContent = oppName;
    }

    updateTurnUI(0);
    showToast(`${oppName} joined!`);
  });

  function playAgain() { window.location.href = '/'; }
  function leaveGame() { window.location.href = '/'; }

  loadGame();
</script>
</body>
</html>
