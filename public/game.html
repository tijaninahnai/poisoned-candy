<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poisoned Candy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111118;
      color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }

    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 0.7rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(17,17,24,0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #1a1a24;
      z-index: 100;
    }

    .room-code { font-size: 0.72rem; color: #444; letter-spacing: 2px; }
    .room-code span { color: #ff6b81; font-weight: 700; font-size: 0.85rem; }
    .hud-status { font-size: 0.78rem; color: #555; }
    .hud-status.playing { color: #4ecca3; }
    .hud-status.waiting { color: #f0c040; }

    #field {
      position: fixed;
      inset: 0;
      top: 44px;
    }

    .candy-item {
      position: absolute;
      width: 82px;
      height: 82px;
      cursor: pointer;
      user-select: none;
      transition: filter 0.2s;
    }

    /* White bg pill that contains the candy image */
    .candy-inner {
      width: 100%;
      height: 100%;
      background: white;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .candy-inner img {
      width: 86%;
      height: 86%;
      object-fit: contain;
      pointer-events: none;
      display: block;
    }

    .candy-item:hover .candy-inner {
      transform: scale(1.1);
      box-shadow: 0 0 16px rgba(255,107,129,0.5);
    }

    .candy-item.picked { pointer-events: none; }

    .candy-item.dimmed .candy-inner {
      opacity: 0.18;
      box-shadow: none;
    }

    /* Waiting overlay */
    #waitingOverlay {
      position: fixed; inset: 0;
      background: rgba(17,17,24,0.93);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      z-index: 200;
    }

    #waitingOverlay h2 { color: #ff6b81; font-size: 1.3rem; }

    .code-card {
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      padding: 1.5rem 2.5rem;
      text-align: center;
    }

    .code-card p { color: #555; font-size: 0.72rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .code-card .code { font-size: 2.4rem; font-weight: 900; color: #ff6b81; letter-spacing: 8px; }

    .pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    .btn-leave {
      background: none; border: 1px solid #2a2a3a;
      color: #555; padding: 0.5rem 1.2rem;
      border-radius: 10px; cursor: pointer; font-size: 0.8rem;
    }

    .btn-leave:hover { border-color: #ff6b81; color: #ff6b81; }

    /* Waiting for opponent pick */
    #waitingPick {
      display: none;
      position: fixed;
      bottom: 1.5rem; left: 50%;
      transform: translateX(-50%);
      background: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 14px;
      padding: 0.8rem 1.4rem;
      font-size: 0.82rem;
      color: #666;
      z-index: 150;
      white-space: nowrap;
    }

    /* Result overlay */
    #resultOverlay {
      position: fixed; inset: 0;
      background: rgba(17,17,24,0.97);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      z-index: 300;
    }

    #resultOverlay.show { display: flex; }

    .result-emoji { font-size: 5rem; line-height: 1; }

    .result-title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .result-title.won { color: #4ecca3; }
    .result-title.lost { color: #ff6b81; }

    .result-sub { color: #555; font-size: 0.9rem; text-align: center; max-width: 280px; }

    .result-btns { display: flex; gap: 0.8rem; margin-top: 0.5rem; }

    .btn-play-again {
      background: #ff6b81; color: white;
      border: none; border-radius: 14px;
      padding: 0.9rem 1.8rem;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }

    .btn-home {
      background: #1a1a24; color: #aaa;
      border: 1px solid #2a2a3a;
      border-radius: 14px;
      padding: 0.9rem 1.8rem;
      font-size: 1rem; cursor: pointer;
    }

    /* Poison reveal glow */
    .candy-item.poison-reveal .candy-inner {
      box-shadow: 0 0 24px rgba(255,107,129,1);
      animation: poisonPulse 0.6s ease-in-out 3;
    }

    @keyframes poisonPulse {
      0%,100% { box-shadow: 0 0 8px rgba(255,107,129,0.4); }
      50% { box-shadow: 0 0 28px rgba(255,107,129,1); }
    }
  </style>
</head>
<body>

<div id="hud">
  <div class="room-code">ROOM <span id="hudCode">—</span></div>
  <div class="hud-status waiting" id="hudStatus">Waiting...</div>
</div>

<div id="field"></div>

<div id="waitingOverlay">
  <h2>🍬 Share this code</h2>
  <div class="code-card">
    <p>ROOM CODE</p>
    <div class="code" id="overlayCode">—</div>
  </div>
  <small class="pulse" style="color:#444">Waiting for opponent to join...</small>
  <button class="btn-leave" onclick="leaveGame()">Leave</button>
</div>

<div id="waitingPick">⏳ Waiting for opponent to pick...</div>

<div id="resultOverlay">
  <div class="result-emoji" id="resultEmoji">🍬</div>
  <div class="result-title" id="resultTitle">—</div>
  <div class="result-sub" id="resultSub">—</div>
  <div class="result-btns">
    <button class="btn-play-again" onclick="playAgain()">Play Again</button>
    <button class="btn-home" onclick="leaveGame()">Home</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const roomCode = window.location.pathname.split('/').pop().toUpperCase();
  const playerName = localStorage.getItem('playerName') || 'Player';

  let gameData = null;
  let myPicked = false;
  let myResult = null;

  document.getElementById('hudCode').textContent = roomCode;
  document.getElementById('overlayCode').textContent = roomCode;

  async function loadGame() {
    try {
      const res = await fetch(`/api/game/${roomCode}`);
      if (!res.ok) {
        document.getElementById('waitingOverlay').innerHTML =
          '<h2 style="color:#ff6b81">Room not found</h2><button class="btn-leave" onclick="location.href=\'/\'">Go home</button>';
        return;
      }

      gameData = await res.json();
      renderField(gameData);
      if (gameData.status === 'in_progress') hideWaiting();
      socket.emit('joinRoom', { roomCode, playerName });

    } catch (err) {
      console.error(err);
    }
  }

  function renderField(data) {
    const field = document.getElementById('field');
    field.innerHTML = '';

    // Better spread: divide field into zones to avoid overlap
    const positions = data.field;

    positions.forEach((pos, index) => {
      const el = document.createElement('div');
      el.className = 'candy-item';
      el.id = `candy-${index}`;
      el.style.left = `calc(${pos.x}% - 41px)`;
      el.style.top = `calc(${pos.y}% - 41px)`;

      const inner = document.createElement('div');
      inner.className = 'candy-inner';
      inner.style.transform = `rotate(${pos.rotation}deg)`;

      const img = document.createElement('img');
      img.src = data.candy.imageUrl;
      img.alt = data.candy.name;

      inner.appendChild(img);
      el.appendChild(inner);
      el.addEventListener('click', () => pickCandy(index, el));
      field.appendChild(el);
    });
  }

  function hideWaiting() {
    document.getElementById('waitingOverlay').style.display = 'none';
    document.getElementById('hudStatus').textContent = 'Pick a candy!';
    document.getElementById('hudStatus').className = 'hud-status playing';
  }

  function pickCandy(index, el) {
    if (myPicked) return;
    myPicked = true;

    // Just dim all others silently — no highlight on picked candy
    document.querySelectorAll('.candy-item').forEach(c => {
      c.classList.add('picked');
      if (c !== el) c.classList.add('dimmed');
    });

    // No visual on picked candy — keeps it mysterious
    socket.emit('pickCandy', { roomCode, playerName, index });
    document.getElementById('hudStatus').textContent = 'Waiting for opponent...';
    document.getElementById('hudStatus').className = 'hud-status waiting';
    document.getElementById('waitingPick').style.display = 'block';
  }

  // My result — only show when server confirms both picked
  socket.on('pickResult', ({ index, isPoison, result, poisonedIndex }) => {
    myResult = { index, isPoison, result, poisonedIndex };
    document.getElementById('waitingPick').style.display = 'none';
    // Wait for opponent result to arrive too before showing screen
    // Server only sends this when both have picked, so show immediately
    setTimeout(() => revealAndShow(), 400);
  });

  socket.on('opponentPickResult', ({ playerName: oppName, index, poisonedIndex }) => {
    // Just log — result screen comes via pickResult
    console.log(`Opponent ${oppName} picked ${index}`);
  });

  function revealAndShow() {
    if (!myResult) return;
    const { result, isPoison, poisonedIndex } = myResult;

    // Reveal poison candy with glow
    const poisonEl = document.getElementById(`candy-${poisonedIndex}`);
    if (poisonEl) {
      poisonEl.classList.remove('dimmed');
      poisonEl.classList.add('poison-reveal');
    }

    setTimeout(() => showResult(result, isPoison), 800);
  }

  function showResult(result, isPoison) {
    const overlay = document.getElementById('resultOverlay');
    const emoji = document.getElementById('resultEmoji');
    const title = document.getElementById('resultTitle');
    const sub = document.getElementById('resultSub');

    if (result === 'won') {
      emoji.textContent = '🎉';
      title.textContent = 'You Won!';
      title.className = 'result-title won';
      sub.textContent = 'You picked a safe candy. Your opponent wasn\'t so lucky!';
    } else {
      emoji.textContent = '☠️';
      title.textContent = 'Poisoned!';
      title.className = 'result-title lost';
      sub.textContent = 'You picked the poisoned candy. Better luck next time!';
    }

    overlay.classList.add('show');
  }

  function playAgain() { window.location.href = '/'; }
  function leaveGame() { window.location.href = '/'; }

  socket.on('opponentJoined', ({ playerName: oppName }) => {
    hideWaiting();
    document.getElementById('hudStatus').textContent = `${oppName} joined — pick a candy!`;
    setTimeout(() => {
      document.getElementById('hudStatus').textContent = 'Pick a candy!';
      document.getElementById('hudStatus').className = 'hud-status playing';
    }, 3000);
  });

  loadGame();
</script>
</body>
</html>
